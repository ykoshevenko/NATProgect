[package]
name = "natcore"
version = "0.1.0"
edition = "2024"

[dependencies]
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand_core = {version="0.6",features=["getrandom"]}
thiserror = "2"

# Зависимости добавляются пошагово (см. дорожную карту):
# - крипто:      x25519-dalek, ed25519-dalek, chacha20poly1305, sha2, rand_core
# - сеть/async:  tokio, tokio-util
# - протокол:    prost, bytes
# - прочее:      serde, serde_json, uuid, thiserror